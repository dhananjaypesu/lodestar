name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # There are no dependencies to cache: the module requires nothing,
          # so there is no go.sum for the cache key to be built from.
          cache: false

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # Every recall assertion is measured against brute-force ground truth, so
      # a regression in the graph shows up as a failing threshold rather than
      # as a slightly worse number nobody notices.
      - name: Test with race detector
        run: go test ./... -race -count=1 -timeout 1800s

      - name: Coverage
        run: |
          go test ./... -coverpkg=./... -coverprofile=coverage.out -count=1
          go tool cover -func=coverage.out | tail -1

      - name: Distance kernels
        run: go test ./internal/vecmath -run xxx -bench . -benchtime 200ms
